<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>APK Guard settings</title>
  <style>
    :root { color-scheme: light; font: 14px system-ui, sans-serif; color: #0e1a38; }
    body { max-width: 520px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: #5c6b8a; margin: 0 0 24px; }
    .card { border: 1px solid #e4e8f1; border-radius: 12px; padding: 18px; }
    label { display: block; font-weight: 650; margin-bottom: 7px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d5dbea; border-radius: 8px; }
    .toggle { display: flex; align-items: center; gap: 9px; margin-top: 18px; }
    .toggle label { margin: 0; }
    small { display: block; color: #7a879f; margin-top: 5px; }
    button { margin-top: 18px; padding: 9px 14px; border: 0; border-radius: 8px; background: #2b67f6; color: #fff; font-weight: 650; cursor: pointer; }
    #saved { color: #12805c; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>APK Guard settings</h1>
  <p>Control automatic page checks and the local scanner connection.</p>
  <div class="card">
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="text" value="http://localhost:8000" spellcheck="false">
    <small>Usually http://localhost:8000</small>
    <div class="toggle">
      <input id="autoScan" type="checkbox">
      <label for="autoScan">Show automatic page scan when a site opens</label>
    </div>
    <small>Runs local page checks and detects Terms, Privacy, APK links, and download signals. APK binaries are only sent when you scan them.</small>
    <button id="save">Save settings</button><span id="saved"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
